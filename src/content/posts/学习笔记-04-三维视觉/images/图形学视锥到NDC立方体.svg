<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <style>
      .title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#172033}
      .sub{font:700 24px 'Microsoft YaHei',sans-serif;fill:#1e3a8a}
      .body{font:20px 'Microsoft YaHei',sans-serif;fill:#253047}
      .small{font:18px 'Microsoft YaHei',sans-serif;fill:#39445a}
      .formula{font:italic 21px Georgia,'Times New Roman',serif;fill:#172033}
      .blue{stroke:#2563eb;stroke-width:3;fill:none}
      .orange{stroke:#ea580c;stroke-width:3;fill:none}
      .green{stroke:#059669;stroke-width:3;fill:none}
      .gray{stroke:#64748b;stroke-width:2;fill:none}
      .dash{stroke-dasharray:8 7}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" class="title">透视视锥什么时候变成标准长方体？</text>
  <text x="800" y="88" text-anchor="middle" class="body">关键顺序：观察空间视锥 → 齐次裁剪坐标 → 除以 w → NDC 标准立方体</text>

  <!-- Stage 1 -->
  <rect x="25" y="120" width="465" height="575" rx="18" class="panel"/>
  <text x="258" y="165" text-anchor="middle" class="sub">① 观察空间：真实的透视视锥</text>

  <!-- camera -->
  <path d="M70 393 L105 373 L105 413 Z" fill="#334155"/>
  <rect x="50" y="380" width="23" height="26" rx="4" fill="#334155"/>
  <text x="78" y="445" text-anchor="middle" class="small">相机</text>
  <circle cx="105" cy="393" r="5" fill="#111827"/>

  <!-- near and far planes in pseudo 3D -->
  <polygon points="190,314 247,330 247,456 190,440" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-width="3"/>
  <polygon points="372,238 450,270 450,535 372,503" fill="#bfdbfe" fill-opacity="0.35" stroke="#2563eb" stroke-width="3"/>
  <line x1="105" y1="393" x2="372" y2="238" class="blue"/>
  <line x1="105" y1="393" x2="450" y2="270" class="blue"/>
  <line x1="105" y1="393" x2="450" y2="535" class="blue"/>
  <line x1="105" y1="393" x2="372" y2="503" class="blue"/>
  <line x1="105" y1="393" x2="466" y2="393" class="gray dash" marker-end="url(#arrow)"/>
  <text x="329" y="383" class="small">−z 或 +z（取决于约定）</text>
  <text x="211" y="300" text-anchor="middle" class="small">近平面</text>
  <text x="412" y="225" text-anchor="middle" class="small">远平面</text>

  <!-- points on same ray -->
  <circle cx="218" cy="327" r="8" fill="#dc2626"/>
  <circle cx="404" cy="252" r="8" fill="#dc2626"/>
  <text x="235" y="316" class="small">近点</text>
  <text x="410" y="244" class="small">远点</text>

  <rect x="58" y="565" width="402" height="98" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="259" y="596" text-anchor="middle" class="body">越远的截面越大，边界向外张开</text>
  <text x="259" y="630" text-anchor="middle" class="formula">视锥边界上：x / z = 常数，y / z = 常数</text>

  <!-- Arrow to stage 2 -->
  <line x1="500" y1="390" x2="575" y2="390" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="538" y="350" text-anchor="middle" class="body">乘投影矩阵 P</text>

  <!-- Stage 2 -->
  <rect x="585" y="120" width="400" height="575" rx="18" class="panel"/>
  <text x="785" y="165" text-anchor="middle" class="sub">② 齐次裁剪空间：先保留 w</text>

  <rect x="635" y="210" width="300" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="785" y="250" text-anchor="middle" class="body">一个点得到四个数</text>
  <text x="785" y="295" text-anchor="middle" class="formula">(x_c, y_c, z_c, w_c)</text>

  <text x="785" y="365" text-anchor="middle" class="body">这里还没有普通的三维长方体</text>
  <text x="785" y="400" text-anchor="middle" class="body">因为坐标仍带着每个点自己的 w</text>

  <rect x="625" y="438" width="320" height="130" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="785" y="476" text-anchor="middle" class="body">GPU 在这里按齐次边界裁剪</text>
  <text x="785" y="519" text-anchor="middle" class="formula">−w_c ≤ x_c ≤ w_c</text>
  <text x="785" y="551" text-anchor="middle" class="formula">−w_c ≤ y_c ≤ w_c</text>

  <text x="785" y="620" text-anchor="middle" class="small">P 把位置、深度和裁剪信息装进四维坐标</text>
  <text x="785" y="651" text-anchor="middle" class="small">“裁剪空间”是坐标空间，不是某种矩阵</text>

  <!-- Arrow to stage 3 -->
  <line x1="995" y1="390" x2="1070" y2="390" stroke="#059669" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="1033" y="337" text-anchor="middle" class="body">透视除法</text>
  <text x="1033" y="368" text-anchor="middle" class="formula">÷ w_c</text>

  <!-- Stage 3 -->
  <rect x="1080" y="120" width="495" height="575" rx="18" class="panel"/>
  <text x="1328" y="165" text-anchor="middle" class="sub">③ NDC：此时才成为标准长方体</text>

  <!-- isometric cube -->
  <polygon points="1195,278 1380,278 1455,235 1270,235" fill="#d1fae5" fill-opacity="0.65" stroke="#059669" stroke-width="3"/>
  <polygon points="1380,278 1455,235 1455,475 1380,518" fill="#a7f3d0" fill-opacity="0.45" stroke="#059669" stroke-width="3"/>
  <polygon points="1195,278 1380,278 1380,518 1195,518" fill="#ecfdf5" fill-opacity="0.75" stroke="#059669" stroke-width="3"/>
  <line x1="1195" y1="518" x2="1270" y2="475" class="green"/>
  <line x1="1270" y1="235" x2="1270" y2="475" class="green"/>
  <line x1="1270" y1="475" x2="1455" y2="475" class="green"/>

  <!-- mapped points -->
  <circle cx="1215" cy="315" r="8" fill="#dc2626"/>
  <circle cx="1430" cy="260" r="8" fill="#dc2626"/>
  <line x1="1215" y1="315" x2="1430" y2="260" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1328" y="555" text-anchor="middle" class="body">远近平面的横向范围被统一</text>
  <text x="1328" y="588" text-anchor="middle" class="formula">x_ndc=x_c/w_c，y_ndc=y_c/w_c</text>
  <text x="1328" y="625" text-anchor="middle" class="small">OpenGL 常用 [−1,1]；部分 API 的深度范围不同</text>

  <!-- bottom explanation -->
  <rect x="25" y="730" width="1550" height="215" rx="18" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="800" y="775" text-anchor="middle" class="sub" fill="#065f46">为什么除以 w 后，斜着张开的视锥会变直？</text>

  <line x1="115" y1="874" x2="370" y2="790" class="orange"/>
  <line x1="115" y1="874" x2="370" y2="918" class="orange"/>
  <line x1="205" y1="844" x2="205" y2="889" class="gray"/>
  <line x1="345" y1="798" x2="345" y2="914" class="gray"/>
  <text x="205" y="831" text-anchor="middle" class="small">近：z 小</text>
  <text x="345" y="785" text-anchor="middle" class="small">远：z 大</text>

  <text x="780" y="830" text-anchor="middle" class="body">同一条视锥边界上的点满足</text>
  <text x="780" y="871" text-anchor="middle" class="formula">x_near / z_near = x_far / z_far = 同一个标准坐标</text>
  <text x="780" y="908" text-anchor="middle" class="body">远处坐标虽然更大，但除数也更大；除完后落到相同边界</text>

  <rect x="1180" y="790" width="315" height="120" rx="12" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="1338" y="828" text-anchor="middle" class="body">随后再做视口变换</text>
  <text x="1338" y="867" text-anchor="middle" class="formula">NDC → 屏幕像素 (u,v)</text>
  <text x="1338" y="898" text-anchor="middle" class="small">标准长方体本身还不是屏幕</text>
</svg>
