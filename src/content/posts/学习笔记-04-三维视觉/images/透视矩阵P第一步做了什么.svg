<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#172033}
      .head{font:700 25px 'Microsoft YaHei',sans-serif;fill:#1e3a8a}
      .body{font:20px 'Microsoft YaHei',sans-serif;fill:#253047}
      .small{font:18px 'Microsoft YaHei',sans-serif;fill:#475569}
      .formula{font:italic 21px Georgia,'Times New Roman',serif;fill:#172033}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .blue{fill:none;stroke:#2563eb;stroke-width:3}
      .orange{fill:none;stroke:#ea580c;stroke-width:3}
      .green{fill:none;stroke:#059669;stroke-width:3}
      .gray{fill:none;stroke:#64748b;stroke-width:2}
      .dash{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fff"/>
  <text x="800" y="52" text-anchor="middle" class="title">只看第一步：乘透视矩阵 P 到底把视锥变成了什么？</text>
  <text x="800" y="87" text-anchor="middle" class="body">为避免正负号干扰，图中用 d&gt;0 表示相机前方深度；常见 OpenGL 约定中 w_c=−z_view=d</text>

  <!-- Panel 1 -->
  <rect x="25" y="115" width="485" height="590" rx="18" class="panel"/>
  <text x="267" y="157" text-anchor="middle" class="head">① 乘 P 之前：观察空间视锥</text>

  <rect x="52" y="358" width="24" height="28" rx="4" fill="#334155"/>
  <path d="M76 372 L108 352 L108 392 Z" fill="#334155"/>
  <circle cx="108" cy="372" r="5" fill="#111827"/>
  <text x="78" y="420" text-anchor="middle" class="small">相机 O</text>

  <polygon points="205,305 252,318 252,426 205,413" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="3"/>
  <polygon points="390,220 478,255 478,512 390,477" fill="#bfdbfe" fill-opacity=".35" stroke="#2563eb" stroke-width="3"/>
  <line x1="108" y1="372" x2="390" y2="220" class="blue"/>
  <line x1="108" y1="372" x2="478" y2="255" class="blue"/>
  <line x1="108" y1="372" x2="478" y2="512" class="blue"/>
  <line x1="108" y1="372" x2="390" y2="477" class="blue"/>
  <line x1="108" y1="372" x2="485" y2="372" class="gray dash" marker-end="url(#blueArrow)"/>
  <text x="225" y="292" text-anchor="middle" class="small">近平面 d=n</text>
  <text x="431" y="207" text-anchor="middle" class="small">远平面 d=f</text>
  <path d="M141 372 A34 34 0 0 0 137 355" class="orange"/>
  <text x="148" y="343" class="small">视场角 θ</text>

  <circle cx="292" cy="302" r="8" fill="#dc2626"/>
  <text x="305" y="289" class="small">点 P(x,y,d)</text>

  <rect x="57" y="557" width="420" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="267" y="592" text-anchor="middle" class="body">原视锥取决于视场角和宽高比</text>
  <text x="267" y="628" text-anchor="middle" class="formula">横向边界：|x| ≤ d · tan(θ_x/2)</text>
  <text x="267" y="656" text-anchor="middle" class="small">深度越大，允许的横向范围越大</text>

  <!-- arrow and matrix -->
  <line x1="520" y1="363" x2="625" y2="363" stroke="#2563eb" stroke-width="5" marker-end="url(#blueArrow)"/>
  <text x="572" y="313" text-anchor="middle" class="head">乘 P</text>
  <text x="572" y="342" text-anchor="middle" class="small">矩阵乘法</text>

  <!-- Panel 2 -->
  <rect x="635" y="115" width="500" height="590" rx="18" class="panel"/>
  <text x="885" y="157" text-anchor="middle" class="head">② 乘 P 之后：齐次标准视锥</text>

  <!-- homogeneous frustum using w as depth -->
  <line x1="705" y1="387" x2="1090" y2="387" class="gray dash" marker-end="url(#blueArrow)"/>
  <text x="1072" y="374" class="formula">w_c</text>
  <line x1="705" y1="387" x2="1090" y2="205" class="orange"/>
  <line x1="705" y1="387" x2="1090" y2="569" class="orange"/>
  <line x1="785" y1="349" x2="785" y2="425" class="blue"/>
  <line x1="1038" y1="229" x2="1038" y2="545" class="blue"/>
  <text x="785" y="338" text-anchor="middle" class="small">w_c=n</text>
  <text x="1038" y="216" text-anchor="middle" class="small">w_c=f</text>
  <text x="720" y="214" class="formula">x_c=−w_c</text>
  <text x="720" y="584" class="formula">x_c=+w_c</text>

  <circle cx="900" cy="295" r="8" fill="#dc2626"/>
  <text x="916" y="285" class="small">P_c(x_c,y_c,z_c,w_c)</text>

  <rect x="670" y="510" width="430" height="162" rx="13" fill="#fff7ed" stroke="#fdba74"/>
  <text x="885" y="545" text-anchor="middle" class="body">P 已经完成三件事</text>
  <text x="695" y="579" class="small">1. 用视场角、宽高比缩放 x 和 y</text>
  <text x="695" y="611" class="small">2. 把前方深度写入 w_c</text>
  <text x="695" y="643" class="small">3. 把远近平面编码进 z_c</text>

  <text x="885" y="688" text-anchor="middle" class="body">它仍向外张开；边界已统一写成 |x_c|≤w_c、|y_c|≤w_c</text>

  <!-- arrow to reference only -->
  <line x1="1145" y1="363" x2="1245" y2="363" stroke="#059669" stroke-width="5" marker-end="url(#orangeArrow)"/>
  <text x="1195" y="313" text-anchor="middle" class="head" fill="#c2410c">下一步</text>
  <text x="1195" y="343" text-anchor="middle" class="formula">÷ w_c</text>

  <!-- Panel 3 context -->
  <rect x="1255" y="115" width="320" height="590" rx="18" class="panel"/>
  <text x="1415" y="157" text-anchor="middle" class="head">③ 除以 w_c 后</text>
  <rect x="1320" y="235" width="185" height="260" fill="#d1fae5" fill-opacity=".6" stroke="#059669" stroke-width="4"/>
  <line x1="1320" y1="365" x2="1505" y2="365" class="green dash"/>
  <text x="1413" y="220" text-anchor="middle" class="small">NDC 标准长方体</text>
  <text x="1306" y="250" text-anchor="end" class="formula">−1</text>
  <text x="1517" y="250" class="formula">+1</text>
  <text x="1415" y="540" text-anchor="middle" class="body">这时才是普通三维范围</text>
  <text x="1415" y="577" text-anchor="middle" class="formula">x_ndc=x_c/w_c</text>
  <text x="1415" y="611" text-anchor="middle" class="formula">y_ndc=y_c/w_c</text>
  <text x="1415" y="656" text-anchor="middle" class="small">本图重点是前两步</text>

  <!-- bottom: large coordinates -->
  <rect x="25" y="738" width="1550" height="230" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="780" text-anchor="middle" class="head">X、Y 很大时，除完一定在 [−1,1] 吗？——不一定，只对视锥内部的点成立</text>

  <rect x="65" y="815" width="430" height="115" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="280" y="850" text-anchor="middle" class="body">视锥内部</text>
  <text x="280" y="883" text-anchor="middle" class="formula">x_c=5，w_c=10 → x_ndc=0.5</text>
  <text x="280" y="913" text-anchor="middle" class="small">落在标准范围内，保留</text>

  <rect x="585" y="815" width="430" height="115" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="800" y="850" text-anchor="middle" class="body">恰好位于视锥边界</text>
  <text x="800" y="883" text-anchor="middle" class="formula">x_c=10，w_c=10 → x_ndc=1</text>
  <text x="800" y="913" text-anchor="middle" class="small">落在 NDC 右边界</text>

  <rect x="1105" y="815" width="430" height="115" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1320" y="850" text-anchor="middle" class="body">视锥外部：横向坐标过大</text>
  <text x="1320" y="883" text-anchor="middle" class="formula">x_c=20，w_c=10 → x_ndc=2</text>
  <text x="1320" y="913" text-anchor="middle" class="small">超过 [−1,1]，会被裁剪，不会显示</text>
</svg>
