<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowBoth" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 27px 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .head { font: 700 21px 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .text { font: 19px 'Microsoft YaHei', sans-serif; fill: #1e293b; }
      .small { font: 16px 'Microsoft YaHei', sans-serif; fill: #475569; }
      .formula { font: 21px 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .scan { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .ray { stroke: #dc2626; stroke-width: 2.5; fill: none; }
      .measure { stroke: #2563eb; stroke-width: 2; marker-start: url(#arrowBoth); marker-end: url(#arrowBoth); }
      .flow { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" class="title">双目相机：从左右图像中的位置差得到三维坐标</text>

  <text x="70" y="82" class="head">第一步：在校正后的左右图像中找到同一个物体点</text>

  <rect x="70" y="105" width="420" height="220" rx="8" class="panel"/>
  <rect x="650" y="105" width="420" height="220" rx="8" class="panel"/>
  <text x="280" y="136" text-anchor="middle" class="text">左相机图像</text>
  <text x="860" y="136" text-anchor="middle" class="text">右相机图像</text>
  <line x1="90" y1="230" x2="470" y2="230" class="scan"/>
  <line x1="670" y1="230" x2="1050" y2="230" class="scan"/>
  <circle cx="350" cy="230" r="10" fill="#dc2626"/>
  <circle cx="890" cy="230" r="10" fill="#dc2626"/>
  <line x1="280" y1="275" x2="350" y2="275" class="measure"/>
  <line x1="860" y1="275" x2="890" y2="275" class="measure"/>
  <text x="315" y="303" text-anchor="middle" class="text">横坐标 uL</text>
  <text x="875" y="303" text-anchor="middle" class="text">横坐标 uR</text>

  <line x1="500" y1="215" x2="630" y2="215" class="flow"/>
  <text x="565" y="196" text-anchor="middle" class="small">匹配同一特征</text>

  <rect x="1090" y="150" width="155" height="125" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1167" y="183" text-anchor="middle" class="text">视差</text>
  <text x="1167" y="219" text-anchor="middle" class="formula">d = uL − uR</text>
  <text x="1167" y="250" text-anchor="middle" class="small">单位：像素</text>

  <text x="70" y="380" class="head">第二步：把视差和已知基线组成三角形，计算深度</text>

  <circle cx="250" cy="660" r="13" fill="#0f172a"/>
  <circle cx="570" cy="660" r="13" fill="#0f172a"/>
  <text x="250" y="696" text-anchor="middle" class="text">左相机光心 CL</text>
  <text x="570" y="696" text-anchor="middle" class="text">右相机光心 CR</text>
  <circle cx="425" cy="430" r="11" fill="#7c3aed"/>
  <text x="445" y="425" class="text">空间点 P</text>
  <line x1="250" y1="660" x2="425" y2="430" class="ray"/>
  <line x1="570" y1="660" x2="425" y2="430" class="ray"/>
  <line x1="250" y1="725" x2="570" y2="725" class="measure"/>
  <text x="410" y="750" text-anchor="middle" class="text">基线 B：两个相机光心的实际距离</text>
  <line x1="610" y1="660" x2="610" y2="430" class="measure"/>
  <text x="625" y="555" class="text">光轴深度 Z</text>

  <rect x="735" y="410" width="455" height="270" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="962" y="450" text-anchor="middle" class="head">第三步：深度继续转换为 XYZ</text>
  <text x="962" y="495" text-anchor="middle" class="formula">Z = f × B / d</text>
  <text x="962" y="532" text-anchor="middle" class="small">f：像素焦距　B：基线　d：视差</text>
  <line x1="785" y1="560" x2="1140" y2="560" stroke="#cbd5e1" stroke-width="2"/>
  <text x="962" y="605" text-anchor="middle" class="formula">X = (u − cx) × Z / fx</text>
  <text x="962" y="641" text-anchor="middle" class="formula">Y = (v − cy) × Z / fy</text>
  <text x="962" y="670" text-anchor="middle" class="small">最终得到该像素在左相机坐标系中的 (X, Y, Z)</text>
</svg>
